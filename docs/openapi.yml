openapi: 3.0.3
info:
  title: Papayal Mobile API
  version: "1.0.0"
servers:
  - url: https://api.papayal.app
paths:
  /api/v1/auth/signup:
    post:
      summary: Sign up with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, phone]
              properties:
                email:
                  type: string
                  format: email
                first_name:
                  type: string
                last_name:
                  type: string
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
                phone:
                  type: string
                device_id:
                  type: string
            example:
              email: user@example.com
              first_name: Jane
              last_name: Smith
              password: Password!23
              password_confirmation: Password!23
              phone: "+15551234567"
              device_id: ios-device-id
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
              example:
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expires_in: 900
                request_id: 123e4567
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.signup_failed
                  message: Signup failed
                  details:
                    email:
                      - Email has already been taken
                request_id: 123e4567
  /api/v1/auth/login:
    post:
      summary: Login with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                device_id:
                  type: string
            example:
              email: user@example.com
              password: Password!23
              device_id: ios-device-id
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
              example:
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expires_in: 900
                request_id: 123e4567
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.invalid_credentials
                  message: Invalid email or password
                request_id: 123e4567
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and obtain new tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
              example:
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expires_in: 900
                request_id: 123e4567
        "401":
          description: Refresh token invalid or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.refresh_revoked
                  message: Refresh token has been revoked
                request_id: 123e4567
  /api/v1/auth/logout:
    post:
      summary: Revoke a single refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedResponse"
              example:
                data:
                  revoked: true
                request_id: 123e4567
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.invalid_refresh
                  message: Invalid refresh token
                request_id: 123e4567
  /api/v1/auth/logout_all:
    post:
      summary: Revoke all active sessions for the authenticated user
      tags: [Auth]
      security:
        - AccessToken: []
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokedResponse"
              example:
                data:
                  revoked: true
                request_id: 123e4567
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: auth.invalid_token
                  message: Invalid token
                request_id: 123e4567
  /api/v1/me:
    get:
      summary: Current authenticated user
      tags: [Me]
      security:
        - AccessToken: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                data:
                  id: 1
                  first_name: Jane
                  last_name: Smith
                  email: user@example.com
                  name: Jane Smith
                  phone: "+15551234567"
                  address: "123 Main St"
                  country_of_residence: "PE"
                  date_of_birth: "1990-01-01"
                  role: user
                  avatar_url: null
                  avatar_thumb_url: null
                request_id: 123e4567
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update current user profile
      tags: [Me]
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                address:
                  type: string
                  nullable: true
                country_of_residence:
                  type: string
                date_of_birth:
                  type: string
                  format: date
                  example: "1990-01-01"
                phone:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                data:
                  id: 1
                  first_name: Jane
                  last_name: Smith
                  email: user@example.com
                  name: Jane Smith
                  phone: "+15551234567"
                  address: "Calle Falsa 123"
                  country_of_residence: "PE"
                  date_of_birth: "1990-01-01"
                  role: user
                  avatar_url: null
                  avatar_thumb_url: null
                request_id: 123e4567
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/avatar:
    post:
      summary: Upload or replace current user's avatar
      tags: [Me]
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      avatar_url:
                        type: string
                      avatar_thumb_url:
                        type: string
                        nullable: true
                  request_id:
                    type: string
              example:
                data:
                  avatar_url: https://api.papayal.app/rails/active_storage/blobs/.../avatar.png
                  avatar_thumb_url: https://api.papayal.app/rails/active_storage/representations/.../avatar.png
                request_id: 123e4567
        "422":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/checkout/validate_kyc:
    post:
      summary: Validate KYC fields required for checkout
      tags: [Checkout]
      security:
        - AccessToken: []
      responses:
        "200":
          description: KYC validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                      missing:
                        type: array
                        items:
                          type: string
                      errors:
                        type: object
                        additionalProperties: true
                  request_id:
                    type: string
              example:
                data:
                  ok: false
                  missing: ["address", "country_of_residence", "date_of_birth"]
                  errors:
                    address:
                      - "can't be blank"
                request_id: 123e4567
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/gift_cards:
    get:
      summary: List gift cards visible to the user
      tags: [GiftCards]
      security:
        - AccessToken: []
      responses:
        "200":
          description: Gift cards in policy scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GiftCard"
                  request_id:
                    type: string
              example:
                data:
                  - id: 10
                    amount_cents: 5000
                    remaining_balance_cents: 4000
                    currency: USD
                    status: active
                    expires_at: "2026-01-07T12:00:00Z"
                    created_at: "2026-01-01T12:00:00Z"
                    updated_at: "2026-01-06T12:00:00Z"
                    sender_id: 1
                    recipient_id: 2
                    merchant_id: 2
                    store_name: "Coffee Shop"
                    merchant_name: "Coffee Shop"
                    merchant_store_name: "Coffee Shop"
                    merchant_logo_url: null
                    merchant:
                      id: 2
                      store_name: "Coffee Shop"
                request_id: 123e4567
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/merchants/{id}/logo:
    post:
      summary: Upload or replace merchant logo
      tags: [Merchants]
      security:
        - AccessToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        "200":
          description: Logo uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      merchant_id:
                        type: integer
                      merchant_store_name:
                        type: string
                      merchant_logo_url:
                        type: string
                  request_id:
                    type: string
              example:
                data:
                  merchant_id: 2
                  merchant_store_name: Coffee Shop
                  merchant_logo_url: https://api.papayal.app/rails/active_storage/blobs/.../logo.png
                request_id: 123e4567
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/gift_cards/{id}:
    get:
      summary: Fetch a single gift card
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gift card details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftCardResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/gift_cards/{id}/redemption_token:
    post:
      summary: Issue a redemption token for the gift card
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Redemption token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                  request_id:
                    type: string
              example:
                data:
                  token: ABC123TOKEN
                  expires_at: "2026-01-07T12:00:00Z"
                request_id: 123e4567
        "403":
          description: Not permitted to view the code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: forbidden
                  message: You are not authorized to perform this action
                request_id: 123e4567
        "422":
          description: Gift card inactive, frozen, or without spendable balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                inactive:
                  value:
                    error: { code: gift_card.inactive, message: Tarjeta inactiva o no disponible }
                    request_id: 123e4567
                frozen:
                  value:
                    error: { code: gift_card.frozen, message: Esta tarjeta está congelada. }
                    request_id: 123e4567
                no_spendable_balance:
                  value:
                    error:
                      code: gift_card.no_spendable_balance
                      message: Esta tarjeta no tiene saldo disponible ahora.
                      details: { spendable_cents: 0, held_cents: 3000, disputed_cents: 0, held_until: "2026-09-12T10:00:00Z" }
                    request_id: 123e4567
  /api/v1/me/gift_cards/{id}/loads:
    get:
      summary: Loads on a card (paginated)
      description: The recipient sees every load; a buyer sees only the loads they paid for.
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Loads, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      gift_card_id: { type: integer }
                      loads:
                        type: array
                        items: { $ref: "#/components/schemas/GiftCardLoad" }
                      page: { type: integer }
                      per_page: { type: integer }
                      total_count: { type: integer }
                      has_more: { type: boolean }
                  request_id: { type: string }
  /api/v1/me/gift_cards/{id}/loads/{load_id}/share_link:
    post:
      summary: Claim URL + prewritten WhatsApp message for one load (sender only)
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: load_id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Share payload
          content:
            application/json:
              example:
                data: { load_id: 9, gift_card_id: 42, claim_url: "https://papayal.app/claim/abc", message: "¡Hola Ana! Te envié una tarjeta de regalo digital de Medicity por $30.00 con Papayal. Ábrela aquí: https://papayal.app/claim/abc" }
                request_id: 123e4567
        "403": { description: Not the load's sender }
  /api/v1/me/gift_cards/{id}/loads/{load_id}/resend:
    post:
      summary: Re-deliver one load's notification (sender only, throttled per card)
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
        - { in: path, name: load_id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Resent }
        "429":
          description: Throttled
          content:
            application/json:
              example:
                error: { code: gift_card.resend_throttled, message: Ya reenviamos la notificación hace poco., details: { retry_in_seconds: 42 } }
                request_id: 123e4567
  /api/v1/me/gift_cards/{id}/share_link:
    post:
      summary: COMPAT — share link for the latest load the caller paid onto the card
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Same payload as the per-load endpoint }
        "422": { description: gift_card.no_load_sent — the caller never loaded this card }
  /api/v1/me/gift_cards/{id}/resend:
    post:
      summary: COMPAT — resend for the latest load the caller paid onto the card
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200": { description: Resent }
        "429": { description: Throttled }
  /api/v1/me/loads:
    get:
      summary: Loads I paid ("Enviadas")
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - { in: query, name: role, required: true, schema: { type: string, enum: [sent] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Loads with card summary, masked recipient, claim_status and refundable_cents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      role: { type: string }
                      loads:
                        type: array
                        items: { $ref: "#/components/schemas/SentLoad" }
                      page: { type: integer }
                      per_page: { type: integer }
                      total_count: { type: integer }
                      has_more: { type: boolean }
                  request_id: { type: string }
  /api/v1/me/activity:
    get:
      summary: Activity feed ("Historial"), newest first, cursor-paginated
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 30, maximum: 100 } }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items: { $ref: "#/components/schemas/ActivityEvent" }
                      next_cursor: { type: string, nullable: true }
                  request_id: { type: string }
  /api/v1/gift_cards/by_payment_intent/{payment_intent_id}:
    get:
      summary: Post-checkout polling — the card (top level) plus the load for this payment
      description: 404 until the webhook has created the load. Visible to the load's buyer or the card's recipient.
      tags: [GiftCards]
      security:
        - AccessToken: []
      parameters:
        - { in: path, name: payment_intent_id, required: true, schema: { type: string } }
      responses:
        "200":
          description: GiftCard fields at top level + `load` (and `top_up` alias)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/GiftCard"
                      - type: object
                        properties:
                          load: { $ref: "#/components/schemas/GiftCardLoad" }
                          top_up: { $ref: "#/components/schemas/GiftCardLoad" }
                  request_id: { type: string }
        "404": { description: Not created yet (keep polling) or not yours }
  /api/v1/claim/{token}:
    get:
      summary: Public claim-link teaser for one LOAD
      tags: [GiftCards]
      parameters:
        - { in: path, name: token, required: true, schema: { type: string } }
      responses:
        "200":
          description: Teaser
          content:
            application/json:
              example:
                data:
                  gift_card_id: 42
                  load_id: 9
                  status: active
                  load_status: available
                  is_reload: false
                  amount_cents: 3000
                  currency: USD
                  merchant_name: Medicity
                  merchant_logo_url: null
                  sender_first_name: Ana
                  note: Feliz cumple
                  recipient_masked_phone: "+593•••3456"
                  recipient_registered: false
                  teaser: "Ana te envió una tarjeta de regalo digital de Medicity · $30.00"
                request_id: 123e4567
        "404": { description: claim_link.not_found }
  /api/v1/config:
    get:
      summary: Public remote config (fees, limits, kill switch, min versions)
      tags: [Config]
      responses:
        "200":
          description: Config
          content:
            application/json:
              example:
                data:
                  purchases_enabled: true
                  min_supported_version: { ios: null, android: null }
                  fees: { buyer_fee_bps: 0, buyer_fee_fixed_cents: 0 }
                  gift_card_limits: { min_cents: 500, max_cents: 20000 }
                  limits:
                    min_load_cents: 500
                    max_load_cents: 20000
                    max_daily_load_per_card_cents: 40000
                    max_card_balance_cents: 50000
                    max_loads_per_card_per_day: 2
                    max_daily_load_per_buyer_cents: 60000
                    max_daily_loads_per_buyer: 3
                    max_30d_load_per_recipient_cents: 100000
                    max_30d_load_per_buyer_cents: 200000
                    buyer_refund_window_hours: 72
                request_id: 123e4567
  /api/v1/checkout/payment_intent:
    post:
      summary: Create a Stripe PaymentIntent for a load (gift or self-reload)
      tags: [Checkout]
      security:
        - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            examples:
              gift:
                value: { merchant_id: 4, amount_cents: 3000, currency: USD, recipient: { name: Ana, phone: "+593999123456", note: "Feliz cumple" }, draft_id: "uuid" }
              self:
                value: { merchant_id: 4, amount_cents: 3000, currency: USD, recipient: { self: true } }
      responses:
        "200":
          description: Client secret + quote + target card
          content:
            application/json:
              example:
                data:
                  client_secret: pi_secret
                  payment_intent_id: pi_123
                  quote: { subtotal_cents: 3000, fee_cents: 0, total_cents: 3000, currency: USD }
                  target: { self: false, existing_card_id: 42, current_balance_cents: 4000, projected_balance_cents: 7000 }
                request_id: 123e4567
        "422":
          description: |
            Cap exceeded (§4.1). `code` is one of checkout.load_amount_out_of_range,
            checkout.card_daily_load_limit, checkout.card_daily_count_limit, checkout.card_balance_limit,
            checkout.buyer_daily_limit, checkout.buyer_daily_count_limit, checkout.recipient_monthly_limit,
            checkout.buyer_monthly_limit, checkout.buyer_dispute_open; `details` carries
            limit_cents|limit, used_cents|used, room_cents|room, resets_at.
          content:
